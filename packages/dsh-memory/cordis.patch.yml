# Extra-context memory subsystem bundle. One installed bundle contributes eight
# independent plugin rows, each backed by its own runtime package under
# ./modules/ (sources are the sibling packages in this workspace) and each with
# its own Config. Later profile patches may override or disable any row.
#
#   memory            @qiuxu/dsh-memory/local       backend  — owns ctx.memory
#   memory-checkpoint @qiuxu/dsh-memory/checkpoint  policy   — archive/receipt/catalog/recall
#   memory-tools      @qiuxu/dsh-memory/tools       surface  — 6 model tools + manual section
#   memory-api        @qiuxu/dsh-memory/api         surface  — owner-authenticated /api/memory.* HTTP routes
#   memory-ui         @qiuxu/dsh-memory/ui           surface  — Web client half (panel trigger + overlay)
#     Local-deployment note: the Web client half must resolve to a manifest whose
#     package root name matches the row specifier. A subpath row (`@qiuxu/dsh-memory/ui`)
#     is misattributed to the outer bundle manifest, so this bundle patch addresses the
#     generated module by file: URL. Upstream uses the bare `@qiuxu/dsh-memory-ui` package
#     name with a real node_modules dependency instead.
#   memory-commands   @qiuxu/dsh-memory/commands    surface  — human /memory command
#   memory-evict      @qiuxu/dsh-memory/evict       policy   — L1 → L2/L3 raw eviction (no LLM)
#   memory-compress   @qiuxu/dsh-memory/compress    policy   — capacity compression (cold tier + batch digests)
#
# Generation: `node scripts/build-bundle.mjs` copies the sibling packages into
# ./modules and links their names under ./node_modules/@qiuxu. Everything the
# rows import then resolves inside this bundle root, which is what the host's
# linked-package resolver needs to route @deepseek-ai/* imports correctly.
- insert:
    - id: memory
      name: '@qiuxu/dsh-memory/local'
      config: {}
    - id: memory-checkpoint
      name: '@qiuxu/dsh-memory/checkpoint'
      config: {}
    - id: memory-tools
      name: '@qiuxu/dsh-memory/tools'
      config: {}
    - id: memory-evict
      name: '@qiuxu/dsh-memory/evict'
      config: {}
    - id: memory-compress
      name: '@qiuxu/dsh-memory/compress'
      config: {}
    - id: memory-api
      name: '@qiuxu/dsh-memory/api'
      config: {}
    - id: memory-ui
      name: '@qiuxu/dsh-memory/ui'
      config: {}
    - id: memory-commands
      name: '@qiuxu/dsh-memory/commands'
      config: {}
