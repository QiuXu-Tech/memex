<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="435" viewBox="0 0 1120 435" role="img" aria-labelledby="title desc"><title id="title">Thirty registered public-issue investigations</title><desc id="desc">4 paired arms completed, 1 interrupted or incomplete, and 25 not started. No project-specific executable acceptance tests were run in this cohort.</desc><rect width="1120" height="435" rx="16" fill="#f8faf9"/><text x="70" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172d36">30 registered public-issue investigations</text><text x="70" y="101" font-family="Arial,sans-serif" font-size="19" fill="#566970">Distinct repositories and owners · source investigations, not production tasks</text><g font-family="Arial,sans-serif"><text x="70" y="187" font-size="21" fill="#263640">Paired arms completed</text><rect x="350" y="165" width="650" height="30" rx="7" fill="#eaf0ef"/><rect x="350" y="165" width="86.67" height="30" rx="7" fill="#2b8a78"/><text x="1020" y="188" font-size="21" font-weight="700" fill="#263640">4</text><text x="70" y="251" font-size="21" fill="#263640">Interrupted / incomplete</text><rect x="350" y="229" width="650" height="30" rx="7" fill="#eaf0ef"/><rect x="350" y="229" width="21.67" height="30" rx="7" fill="#de9c45"/><text x="1020" y="252" font-size="21" font-weight="700" fill="#263640">1</text><text x="70" y="315" font-size="21" fill="#263640">Not started</text><rect x="350" y="293" width="650" height="30" rx="7" fill="#eaf0ef"/><rect x="350" y="293" width="541.67" height="30" rx="7" fill="#bdc8cd"/><text x="1020" y="316" font-size="21" font-weight="700" fill="#263640">25</text></g><text x="70" y="389" font-family="Arial,sans-serif" font-size="17" fill="#566970">Each bar uses a 30-task scale. Paired completion does not imply a passing project test.</text></svg>
