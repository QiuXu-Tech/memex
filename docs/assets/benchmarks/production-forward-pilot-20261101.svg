  <text x="42" y="77" fill="#536b7b" font-family="Arial,sans-serif" font-size="15">Paired arms · same two tasks repeated · no production deployment</text>
  <text x="42" y="122" fill="#536b7b" font-family="Arial,sans-serif" font-size="13" font-weight="700">TASK / ARM</text>
  <text x="429" y="122" fill="#536b7b" font-family="Arial,sans-serif" font-size="13" font-weight="700">INITIAL ATTEMPT</text>
  <text x="736" y="122" fill="#536b7b" font-family="Arial,sans-serif" font-size="13" font-weight="700">ENGINEERING RETRY</text>
