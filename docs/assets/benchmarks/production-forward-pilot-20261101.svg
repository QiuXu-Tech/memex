<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="525" viewBox="0 0 1120 525" role="img" aria-labelledby="title desc">
  <title id="title">Two real-task shadow comparisons: initial attempts and engineering retry</title>
  <desc id="desc">The initial four attempts did not edit the requested files. An engineering retry on the same two tasks produced four edits; both Memex audit candidates failed the frozen order test, while the two Axios candidates received partial or split AI review. A further Memex-only repeat with a sandbox test tool passed the frozen cases in both arms but failed newly added checks in both. A later session did not use memory tools. Repeats are not new samples.</desc>
