<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Two executable real-agent comparisons</title><desc id="desc">Happy DOM control passed eight of eight checks and Memex seven of eight; Neural-LAM both passed ten of ten. The extra Happy DOM check covers direct replaceChild. Input tokens include cache.</desc><rect width="1120" height="610" rx="16" fill="#f7faf9"/><g font-family="Arial,sans-serif"><text x="45" y="57" font-size="29" font-weight="700" fill="#172d36">Two executable real-agent comparisons</text><text x="45" y="95" font-size="18" fill="#566970">Three sessions per arm · historical public-issue shadow tasks</text><text x="310" y="148" font-size="19" font-weight="700" fill="#263640">Checks passed</text><text x="700" y="148" font-size="19" font-weight="700" fill="#263640">Input tokens · includes cache</text><text x="45" y="202" font-size="19" fill="#263640">Happy DOM · Control</text><rect x="310" y="180" width="260" height="28" rx="6" fill="#e8eeee"/><rect x="310" y="180" width="260.0" height="28" rx="6" fill="#4e7690"/><text x="590" y="202" font-size="19" font-weight="700" fill="#263640">8/8</text><rect x="700" y="180" width="280" height="28" rx="6" fill="#e8eeee"/><rect x="700" y="180" width="154.7" height="28" rx="6" fill="#4e7690"/><text x="995" y="202" font-size="19" font-weight="700" fill="#263640">497k</text><text x="45" y="275" font-size="19" fill="#263640">Happy DOM · Memex</text><rect x="310" y="253" width="260" height="28" rx="6" fill="#e8eeee"/><rect x="310" y="253" width="227.5" height="28" rx="6" fill="#2b8a78"/><text x="590" y="275" font-size="19" font-weight="700" fill="#263640">7/8</text><rect x="700" y="253" width="280" height="28" rx="6" fill="#e8eeee"/><rect x="700" y="253" width="235.8" height="28" rx="6" fill="#2b8a78"/><text x="995" y="275" font-size="19" font-weight="700" fill="#263640">758k</text><text x="45" y="348" font-size="19" fill="#263640">Neural-LAM · Control</text><rect x="310" y="326" width="260" height="28" rx="6" fill="#e8eeee"/><rect x="310" y="326" width="260.0" height="28" rx="6" fill="#4e7690"/><text x="590" y="348" font-size="19" font-weight="700" fill="#263640">10/10</text><rect x="700" y="326" width="280" height="28" rx="6" fill="#e8eeee"/><rect x="700" y="326" width="151.8" height="28" rx="6" fill="#4e7690"/><text x="995" y="348" font-size="19" font-weight="700" fill="#263640">488k</text><text x="45" y="421" font-size="19" fill="#263640">Neural-LAM · Memex</text><rect x="310" y="399" width="260" height="28" rx="6" fill="#e8eeee"/><rect x="310" y="399" width="260.0" height="28" rx="6" fill="#2b8a78"/><text x="590" y="421" font-size="19" font-weight="700" fill="#263640">10/10</text><rect x="700" y="399" width="280" height="28" rx="6" fill="#e8eeee"/><rect x="700" y="399" width="251.1" height="28" rx="6" fill="#2b8a78"/><text x="995" y="421" font-size="19" font-weight="700" fill="#263640">807k</text><text x="45" y="512" font-size="16" fill="#566970">Happy DOM includes one related replaceChild check beyond the original issue.</text><text x="45" y="540" font-size="16" fill="#566970">Neural-LAM uses mocked ML dependencies. Two tasks cannot establish production benefit.</text><text x="45" y="568" font-size="16" fill="#566970">Token counts are not a billed cost comparison; follow-up sessions are excluded.</text></g></svg>
