name: Feature request
description: Suggest an improvement for dsh-memory
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What long-horizon memory problem are you hitting?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Behavior, config/API surface, and how it could be evaluated.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - retrieval quality
        - capacity/compression
        - eviction policy
        - UI
        - operations (backup/GC/observability)
        - tests/benchmarks
        - docs
    validations:
      required: true
