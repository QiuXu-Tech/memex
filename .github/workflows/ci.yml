name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: offline harness + bundle parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build generated bundle modules
        run: node scripts/build-bundle.mjs
      - name: Check source/bundle parity
        run: node scripts/check-bundle.mjs
      - name: Run offline harness
        run: node --import ./test/register.mjs ./test/run.mjs
      - name: SQLite concurrency and recovery
        run: node --import ./test/register.mjs --test ./test/sqlite-consistency.mjs
      - name: Pilot loop, review and accounting regressions
        run: |
          python3 scripts/test-pilot-loop.py
          python3 scripts/test-pilot-review.py
          python3 scripts/test-pilot-review-guard.py
          python3 scripts/test-production-prospective-guard.py
          python3 scripts/test-prospective-candidate-review.py
          python3 scripts/test-prospective-vote-normalize.py
          python3 scripts/test-prospective-real-agent-pilot.py
          python3 scripts/test-prospective-real-agent-pilot-v2.py
          python3 scripts/test-prospective-real-agent-pilot-v3.py
          python3 scripts/test-prospective-real-agent-pilot-v4.py
          python3 scripts/test-prospective-real-agent-pilot-v5.py
          python3 scripts/test-prospective-real-agent-pilot-v6.py
          python3 scripts/test-prospective-real-agent-pilot-v7.py
          python3 scripts/test-prospective-real-agent-pilot-v8.py
          python3 scripts/test-prospective-real-agent-pilot-v9.py
          python3 scripts/test-prospective-real-agent-pilot-v10.py
          python3 scripts/test-prospective-real-agent-pilot-v11.py
          python3 scripts/test-prospective-real-agent-pilot-v12.py
          python3 scripts/test-prospective-real-agent-pilot-v13.py
          python3 scripts/test-prospective-real-agent-pilot-v14.py
          python3 scripts/test-prospective-gateway.py
          python3 scripts/test-prospective-gateway-pilot-v15.py
          python3 scripts/test-prospective-gateway-pilot-v16.py
          python3 scripts/test-prospective-gateway-pilot-v17.py
          python3 scripts/test-prospective-gateway-pilot-v18.py
          python3 scripts/test-prospective-gateway-pilot-v19.py
          python3 scripts/test-prospective-gateway-pilot-v20.py
          python3 scripts/test-prospective-gateway-pilot-v21.py
          python3 scripts/test-prospective-gateway-pilot-v22.py
          python3 scripts/test-prospective-gateway-pilot-v23.py
          python3 scripts/test-prospective-gateway-pilot-v24.py
          python3 scripts/test-prospective-gateway-pilot-v25.py
          python3 scripts/test-prospective-gateway-pilot-v26.py
          python3 scripts/test-prospective-gateway-pilot-v27.py
          python3 scripts/test-prospective-agent-v28.py
          python3 scripts/test-prospective-gateway-adjudication-v33.py
          python3 scripts/test-prospective-gateway-posthoc-v15.py
          python3 scripts/test-prospective-gateway-posthoc-v15-budgeted.py
          python3 scripts/test-prospective-gateway-posthoc-v16-budgeted.py
          python3 scripts/test-prospective-gateway-adjudication-v16-fallback.py
          python3 scripts/test-prospective-gateway-fallback-adjudications.py
          python3 scripts/test-prospective-batch17-unstarted-reviews.py
          python3 scripts/test-prospective-budgeted-reference-normalize.py
          python3 scripts/test-prospective-posthoc-rubric-review.py
          python3 scripts/test-prospective-unstarted-adjudication.py
          python3 scripts/test-summarize-prospective-agent-batches.py
          python3 scripts/test-prospective-review-normalize-v2.py
          python3 scripts/test-pilot-citations.py
          python3 scripts/test-pilot-batch-stop.py
          python3 scripts/test-pilot-expanded-ledger.py
          python3 scripts/test-production-pilot-worker.py
          python3 scripts/test-production-pilot-analyze.py
          python3 scripts/test-pilot-autonomy-analyze.py
          if command -v zstd >/dev/null; then python3 scripts/test-pilot-codex-extract.py; else echo "SKIP Codex extraction test: zstd unavailable"; fi
      - name: Recall evaluation (synthetic)
        run: node --import ./test/register.mjs ./scripts/recall-eval.mjs --suite synthetic --threshold 0.9
      - name: Scale smoke (1k records)
        run: node --import ./test/register.mjs ./scripts/scale-bench.mjs --records 1000 --tokens 1000
